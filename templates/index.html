<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title data-i18n="pageTitle">Notes → PDF</title>
<style>
    :root {
        --bg: #0d1117;
        --bg-elev: #161b22;
        --bg-hover: #1c2028;
        --fg: #e6edf3;
        --muted: #8b949e;
        --border: #30363d;
        --accent: #58a6ff;
        --ok: #3fb950;
        --warn: #d29922;
        --fail: #f85149;
        --chip-bg: #21262d;
        --mono: ui-monospace, "SF Mono", "Menlo", "DejaVu Sans Mono", monospace;
    }

    html[data-theme="light"] {
        --bg: #f6f8fa;
        --bg-elev: #ffffff;
        --bg-hover: #eef1f4;
        --fg: #1f2328;
        --muted: #59636e;
        --border: #d1d9e0;
        --accent: #0969da;
        --ok: #1a7f37;
        --warn: #9a6700;
        --fail: #cf222e;
        --chip-bg: #eef1f4;
    }

    * { box-sizing: border-box; }

    body {
        font-family: -apple-system, "system-ui", "Segoe UI", Roboto, sans-serif;
        margin: 0;
        padding: 0 0 4em;
        color: var(--fg);
        background: var(--bg);
        font-size: 14px;
        line-height: 1.45;
        transition: background 0.2s ease, color 0.2s ease;
    }

    code { font-family: var(--mono); }

    /* Top bar */
    .topbar {
        display: flex;
        align-items: center;
        gap: 20px;
        padding: 12px 24px;
        background: var(--bg-elev);
        border-bottom: 1px solid var(--border);
        position: sticky;
        top: 0;
        z-index: 20;
    }
    .brand { display: flex; align-items: baseline; gap: 8px; }
    .brand-mark {
        background: var(--accent);
        color: var(--bg);
        padding: 2px 8px;
        border-radius: 4px;
        font-weight: 700;
        font-size: 12px;
        letter-spacing: 0.5px;
        font-family: var(--mono);
    }
    .brand-title { font-weight: 600; font-size: 15px; }
    .topbar-right { margin-left: auto; position: relative; }

    /* Main content */
    .main { padding: 24px; max-width: 1200px; margin: 0 auto; }

    .layout {
        display: flex;
        flex-direction: column;
        gap: 1.5em;
    }

    @media (min-width: 900px) {
        .layout { flex-direction: row; align-items: flex-start; }
        .form-panel { width: 380px; flex-shrink: 0; }
        .preview-panel { flex: 1; min-width: 0; }
    }

    .panel {
        background: var(--bg-elev);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 18px;
    }

    .panel-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 14px;
    }
    .panel-title {
        font-size: 12px;
        font-weight: 600;
        color: var(--muted);
        text-transform: uppercase;
        letter-spacing: 0.5px;
    }

    .group-title {
        font-size: 11px;
        font-weight: 600;
        color: var(--muted);
        text-transform: uppercase;
        letter-spacing: 0.5px;
        margin: 1.6em 0 0.7em;
        padding-top: 1.2em;
        border-top: 1px solid var(--border);
    }
    .field-group:first-child .group-title { margin-top: 0; padding-top: 0; border-top: none; }

    label { display: block; margin-top: 1em; font-weight: 500; font-size: 0.85em; color: var(--muted); }

    input, select {
        margin-top: 0.4em;
        padding: 0.55em 0.7em;
        width: 100%;
        background: var(--bg);
        border: 1px solid var(--border);
        border-radius: 6px;
        color: var(--fg);
        font-size: 0.9em;
        font-family: inherit;
        transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }

    input:focus, select:focus {
        outline: none;
        border-color: var(--accent);
        box-shadow: 0 0 0 3px rgba(88, 166, 255, 0.15);
    }

    input[type="file"]::file-selector-button {
        background: var(--chip-bg);
        color: var(--fg);
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 0.4em 0.8em;
        margin-right: 0.8em;
        cursor: pointer;
    }

    input[type="color"] { width: 3.5em; padding: 0.15em; cursor: pointer; }
    input[type="range"] { padding: 0; background: transparent; accent-color: var(--accent); }

    button[type="submit"] {
        margin-top: 1.8em;
        padding: 0.7em 1.4em;
        width: 100%;
        background: var(--accent);
        color: var(--bg);
        border: none;
        border-radius: 6px;
        font-size: 0.95em;
        font-weight: 700;
        cursor: pointer;
        transition: opacity 0.15s ease;
    }
    button[type="submit"]:hover { opacity: 0.88; }

    .hint { color: var(--muted); font-size: 0.8em; margin-top: 0.4em; }

    .error {
        margin: 0 0 1.5em;
        padding: 0.8em 1em;
        background: rgba(248, 81, 73, 0.08);
        border: 1px solid rgba(248, 81, 73, 0.4);
        border-left-width: 3px;
        border-radius: 6px;
        color: var(--fg);
        font-size: 0.9em;
    }

    .hidden { display: none !important; }

    .checkbox-row {
        display: flex;
        align-items: center;
        gap: 0.6em;
        margin-top: 1em;
        cursor: pointer;
    }
    .checkbox-row input[type="checkbox"] {
        width: auto;
        margin: 0;
        accent-color: var(--accent);
    }
    .checkbox-row span {
        font-weight: 500;
        font-size: 0.85em;
        color: var(--muted);
    }

    /* preview panel */
    .preview-panel { position: sticky; top: 76px; }

    .chip {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 2px 9px;
        border-radius: 12px;
        font-size: 11px;
        font-family: var(--mono);
    }
    .chip-warn {
        background: rgba(210, 153, 34, 0.12);
        color: var(--warn);
        border: 1px solid rgba(210, 153, 34, 0.4);
    }
    .chip-fail {
        background: rgba(248, 81, 73, 0.12);
        color: var(--fail);
        border: 1px solid rgba(248, 81, 73, 0.4);
    }

    .preview-frame-wrap {
        position: relative;
        height: 76vh;
        border-radius: 6px;
        overflow: hidden;
        border: 1px solid var(--border);
        background: #fff;
    }

    #preview-frame { width: 100%; height: 100%; border: none; display: block; }

    .preview-placeholder {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 2em;
        color: var(--muted);
        background: var(--bg-elev);
        font-size: 0.9em;
    }
    .preview-placeholder.error { color: var(--fail); }

    /* settings popover */
    .icon-btn {
        width: 38px;
        height: 38px;
        border-radius: 6px;
        background: var(--chip-bg);
        border: 1px solid var(--border);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 4px;
        cursor: pointer;
        transition: border-color 0.15s ease;
    }
    .icon-btn span {
        display: block;
        width: 16px;
        height: 2px;
        background: var(--muted);
        border-radius: 2px;
        transition: background 0.15s ease;
    }
    .icon-btn:hover, .icon-btn[aria-expanded="true"] {
        border-color: var(--accent);
    }
    .icon-btn:hover span, .icon-btn[aria-expanded="true"] span { background: var(--accent); }

    .popover {
        position: absolute;
        top: calc(100% + 8px);
        right: 0;
        min-width: 230px;
        background: var(--bg-elev);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 14px;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
        z-index: 30;
    }
    .popover-title {
        font-size: 11px;
        font-weight: 600;
        color: var(--muted);
        text-transform: uppercase;
        letter-spacing: 0.5px;
        margin-bottom: 10px;
    }
    .settings-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-top: 12px;
    }
    .settings-row:first-of-type { margin-top: 0; }
    .settings-row > span { font-size: 0.85em; color: var(--fg); }

    .lang-toggle {
        display: flex;
        border: 1px solid var(--border);
        border-radius: 999px;
        overflow: hidden;
    }
    .lang-btn {
        border: none;
        background: var(--chip-bg);
        color: var(--muted);
        font-size: 0.7em;
        font-family: var(--mono);
        font-weight: 600;
        padding: 0.35em 0.7em;
        cursor: pointer;
        transition: background 0.15s ease, color 0.15s ease;
    }
    .lang-btn.active { background: var(--accent); color: var(--bg); }

    .switch { position: relative; width: 32px; height: 18px; flex-shrink: 0; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .switch .track {
        position: absolute;
        inset: 0;
        background: var(--chip-bg);
        border: 1px solid var(--border);
        border-radius: 999px;
        transition: background 0.15s ease;
        cursor: pointer;
    }
    .switch .track::before {
        content: "";
        position: absolute;
        width: 12px;
        height: 12px;
        left: 2px;
        top: 2px;
        background: var(--muted);
        border-radius: 50%;
        transition: transform 0.15s ease, background 0.15s ease;
    }
    .switch input:checked + .track { background: var(--accent); border-color: var(--accent); }
    .switch input:checked + .track::before { transform: translateX(14px); background: var(--bg); }
</style>
</head>
<body>
<header class="topbar">
    <div class="brand">
        <span class="brand-mark">N2P</span>
        <span class="brand-title" data-i18n="pageTitle">Notes → PDF</span>
    </div>
    <div class="topbar-right">
        <button id="settings-toggle" class="icon-btn" aria-label="Menu" aria-expanded="false">
            <span></span><span></span><span></span>
        </button>
        <div id="settings-panel" class="popover hidden">
            <div class="popover-title" data-i18n="settingsTitle">Settings</div>

            <div class="settings-row">
                <span data-i18n="languageLabel">Language</span>
                <div class="lang-toggle">
                    <button type="button" class="lang-btn" data-lang="en">EN</button>
                    <button type="button" class="lang-btn" data-lang="es">ES</button>
                </div>
            </div>

            <div class="settings-row">
                <span data-i18n="appearanceLabel">Appearance</span>
                <label class="switch">
                    <input type="checkbox" id="dark-mode-toggle">
                    <span class="track"></span>
                </label>
            </div>
        </div>
    </div>
</header>

<div class="main">
    {% if error %}
    <p class="error">{{ error }}</p>
    {% endif %}

    <div class="layout">
        <div class="panel form-panel">
            <form id="pdf-form" action="/convert" method="post" enctype="multipart/form-data">
                <input type="hidden" id="lang-field" name="lang" value="en">

                <div class="field-group">
                    <div class="group-title" data-i18n="groupSource">Source</div>

                    <label for="platform" data-i18n="platformLabel">Source platform</label>
                    <select id="platform" name="platform">
                        <option value="notion" selected data-i18n="platformNotion">Notion</option>
                        <option value="obsidian" data-i18n="platformObsidian">Obsidian</option>
                    </select>

                    <label for="file" data-i18n="fileLabel">Export file (.md or .zip)</label>
                    <input type="file" id="file" name="file" accept=".md,.zip" required>
                    <p class="hint" id="file-hint">If your page has images or subpages, Notion exports it as a .zip — upload it as is, without unzipping.</p>
                </div>

                <div class="field-group">
                    <div class="group-title" data-i18n="groupAppearance">Appearance</div>

                    <label for="theme" data-i18n="themeLabel">Theme</label>
                    <select id="theme" name="theme" style="text-transform: capitalize;">
                        {% for t in themes %}
                        <option value="{{ t }}" style="text-transform: capitalize;">{{ t }}</option>
                        {% endfor %}
                    </select>

                    <label for="accent_color" data-i18n="accentLabel">Accent color</label>
                    <input type="color" id="accent_color" name="accent_color" value="#2563eb">

                    <label for="page_size" data-i18n="pageSizeLabel">Page size</label>
                    <select id="page_size" name="page_size">
                        <option value="A4">A4</option>
                        <option value="Carta" data-i18n="pageSizeLetter">Letter</option>
                    </select>
                </div>

                <div class="field-group">
                    <div class="group-title" data-i18n="groupHeaderFooter">Header &amp; footer</div>

                    <label for="header_text" data-i18n="headerTextLabel">Header text (optional)</label>
                    <input type="text" id="header_text" name="header_text" maxlength="120" data-i18n-placeholder="headerTextPlaceholder" placeholder="e.g. Company name">

                    <label for="footer_text" data-i18n="footerTextLabel">Footer text (optional)</label>
                    <input type="text" id="footer_text" name="footer_text" maxlength="120" data-i18n-placeholder="footerTextPlaceholder" placeholder="e.g. Confidential">

                    <label class="checkbox-row" for="page_numbers_enabled">
                        <input type="checkbox" id="page_numbers_enabled" name="page_numbers_enabled">
                        <span data-i18n="pageNumbersLabel">Add page numbers</span>
                    </label>
                </div>

                <div class="field-group">
                    <div class="group-title" data-i18n="groupWatermark">Watermark</div>

                    <label for="watermark_type" data-i18n="watermarkLabel">Watermark</label>
                    <select id="watermark_type" name="watermark_type">
                        <option value="none" data-i18n="watermarkNone">None</option>
                        <option value="text" data-i18n="watermarkText">Text</option>
                        <option value="image" data-i18n="watermarkImage">Image</option>
                    </select>

                    <div id="watermark-text-group" class="hidden">
                        <label for="watermark_text" data-i18n="watermarkTextLabel">Watermark text</label>
                        <input type="text" id="watermark_text" name="watermark_text" value="PREVIEW" maxlength="40">
                    </div>

                    <div id="watermark-image-group" class="hidden">
                        <label for="watermark_image" data-i18n="watermarkImageLabel">Watermark image</label>
                        <input type="file" id="watermark_image" name="watermark_image" accept="image/png,image/jpeg,image/svg+xml">
                    </div>

                    <div id="watermark-settings-group" class="hidden">
                        <label for="watermark_opacity"><span data-i18n="opacityLabel">Opacity</span> (<span id="opacity-value">0.15</span>)</label>
                        <input type="range" id="watermark_opacity" name="watermark_opacity" min="0.05" max="0.5" step="0.01" value="0.15">

                        <label for="watermark_size"><span data-i18n="watermarkSizeLabel">Size</span> (<span id="watermark-size-value">100</span>%)</label>
                        <input type="range" id="watermark_size" name="watermark_size" min="30" max="250" step="5" value="100">
                    </div>
                </div>

                <div class="field-group">
                    <div class="group-title" data-i18n="groupCodeColors">Code colors</div>

                    <label class="checkbox-row" for="code_colors_enabled">
                        <input type="checkbox" id="code_colors_enabled" name="code_colors_enabled">
                        <span data-i18n="codeColorsLabel">Customize code colors</span>
                    </label>

                    <div id="code-colors-group" class="hidden">
                        <label class="checkbox-row" for="code_colors_same">
                            <input type="checkbox" id="code_colors_same" name="code_colors_same" checked>
                            <span data-i18n="codeColorsSameLabel">Use the same colors for both</span>
                        </label>

                        <div id="code-colors-shared">
                            <label for="code_bg_color" data-i18n="codeBgLabel">Code background</label>
                            <input type="color" id="code_bg_color" name="code_bg_color" value="#f4f4f5">

                            <label for="code_text_color" data-i18n="codeTextLabel">Code text color</label>
                            <input type="color" id="code_text_color" name="code_text_color" value="#1a1a1a">
                        </div>

                        <div id="code-colors-split" class="hidden">
                            <label for="block_code_bg_color" data-i18n="blockCodeBgLabel">Code block (```) background</label>
                            <input type="color" id="block_code_bg_color" name="block_code_bg_color" value="#f4f4f5">

                            <label for="block_code_text_color" data-i18n="blockCodeTextLabel">Code block text color</label>
                            <input type="color" id="block_code_text_color" name="block_code_text_color" value="#1a1a1a">

                            <label for="inline_code_bg_color" data-i18n="inlineCodeBgLabel">Inline code (`) background</label>
                            <input type="color" id="inline_code_bg_color" name="inline_code_bg_color" value="#f4f4f5">

                            <label for="inline_code_text_color" data-i18n="inlineCodeTextLabel">Inline code text color</label>
                            <input type="color" id="inline_code_text_color" name="inline_code_text_color" value="#1a1a1a">
                        </div>
                    </div>
                </div>

                <button type="submit" data-i18n="downloadBtn">Download PDF</button>
            </form>
        </div>

        <div class="panel preview-panel">
            <div class="panel-header">
                <span class="panel-title" data-i18n="previewHeading">Preview</span>
                <span id="preview-status"></span>
            </div>
            <div class="preview-frame-wrap">
                <iframe id="preview-frame" class="hidden" title="PDF preview"></iframe>
                <div id="preview-placeholder" class="preview-placeholder" data-i18n="previewPlaceholder">Upload a file to see the preview</div>
            </div>
        </div>
    </div>
</div>

<script>
    const STRINGS = {
        en: {
            pageTitle: "Notes → PDF",
            groupSource: "Source",
            groupAppearance: "Appearance",
            groupHeaderFooter: "Header & footer",
            groupWatermark: "Watermark",
            groupCodeColors: "Code colors",
            platformLabel: "Source platform",
            platformNotion: "Notion",
            platformObsidian: "Obsidian",
            fileLabel: "Export file (.md or .zip)",
            fileHintNotion: "If your page has images or subpages, Notion exports it as a .zip — upload it as is, without unzipping.",
            fileHintObsidian: "Zip the note (or the whole vault) including its attachments folder. Wikilinks and embeds (![[...]], [[...]]) are converted automatically.",
            themeLabel: "Theme",
            accentLabel: "Accent color",
            pageSizeLabel: "Page size",
            pageSizeLetter: "Letter",
            headerTextLabel: "Header text (optional)",
            headerTextPlaceholder: "e.g. Company name",
            footerTextLabel: "Footer text (optional)",
            footerTextPlaceholder: "e.g. Confidential",
            pageNumbersLabel: "Add page numbers",
            watermarkLabel: "Watermark",
            watermarkNone: "None",
            watermarkText: "Text",
            watermarkImage: "Image",
            watermarkTextLabel: "Watermark text",
            watermarkImageLabel: "Watermark image",
            opacityLabel: "Opacity",
            watermarkSizeLabel: "Size",
            codeColorsLabel: "Customize code colors",
            codeColorsSameLabel: "Use the same colors for both",
            codeBgLabel: "Code background",
            codeTextLabel: "Code text color",
            blockCodeBgLabel: "Code block (```) background",
            blockCodeTextLabel: "Code block text color",
            inlineCodeBgLabel: "Inline code (`) background",
            inlineCodeTextLabel: "Inline code text color",
            downloadBtn: "Download PDF",
            previewHeading: "Preview",
            previewGenerating: "Generating…",
            previewPlaceholder: "Upload a file to see the preview",
            previewError: "Could not generate the preview",
            settingsTitle: "Settings",
            languageLabel: "Language",
            appearanceLabel: "Appearance"
        },
        es: {
            pageTitle: "Notas → PDF",
            groupSource: "Origen",
            groupAppearance: "Apariencia",
            groupHeaderFooter: "Encabezado y pie",
            groupWatermark: "Marca de agua",
            groupCodeColors: "Colores de código",
            platformLabel: "Plataforma de origen",
            platformNotion: "Notion",
            platformObsidian: "Obsidian",
            fileLabel: "Archivo exportado (.md o .zip)",
            fileHintNotion: "Si tu página tiene imágenes o subpáginas, Notion la exporta como .zip — súbelo tal cual, sin descomprimir.",
            fileHintObsidian: "Comprime la nota (o todo el vault) incluyendo su carpeta de adjuntos. Los wikilinks y embeds (![[...]], [[...]]) se convierten automáticamente.",
            themeLabel: "Tema",
            accentLabel: "Color de acento",
            pageSizeLabel: "Tamaño de página",
            pageSizeLetter: "Carta",
            headerTextLabel: "Texto del encabezado (opcional)",
            headerTextPlaceholder: "ej. Nombre de la empresa",
            footerTextLabel: "Texto del pie de página (opcional)",
            footerTextPlaceholder: "ej. Confidencial",
            pageNumbersLabel: "Agregar número de página",
            watermarkLabel: "Marca de agua",
            watermarkNone: "Ninguna",
            watermarkText: "Texto",
            watermarkImage: "Imagen",
            watermarkTextLabel: "Texto de la marca de agua",
            watermarkImageLabel: "Imagen de marca de agua",
            opacityLabel: "Opacidad",
            watermarkSizeLabel: "Tamaño",
            codeColorsLabel: "Personalizar colores del código",
            codeColorsSameLabel: "Usar los mismos colores para ambos",
            codeBgLabel: "Fondo del código",
            codeTextLabel: "Color del texto del código",
            blockCodeBgLabel: "Fondo del bloque de código (```)",
            blockCodeTextLabel: "Color del texto del bloque de código",
            inlineCodeBgLabel: "Fondo del código en línea (`)",
            inlineCodeTextLabel: "Color del texto del código en línea",
            downloadBtn: "Descargar PDF",
            previewHeading: "Vista previa",
            previewGenerating: "Generando…",
            previewPlaceholder: "Sube un archivo para ver la vista previa",
            previewError: "No se pudo generar la vista previa",
            settingsTitle: "Configuración",
            languageLabel: "Idioma",
            appearanceLabel: "Apariencia"
        }
    };

    function updateFileHint() {
        const lang = localStorage.getItem("notes2pdf-lang") || "en";
        const platform = document.getElementById("platform").value;
        const key = platform === "obsidian" ? "fileHintObsidian" : "fileHintNotion";
        document.getElementById("file-hint").textContent = STRINGS[lang][key];
    }

    (function () {
        const root = document.documentElement;
        const themeToggle = document.getElementById("dark-mode-toggle");
        const settingsToggle = document.getElementById("settings-toggle");
        const settingsPanel = document.getElementById("settings-panel");
        const langButtons = document.querySelectorAll(".lang-btn");
        const langField = document.getElementById("lang-field");

        function applyTheme(t) {
            root.setAttribute("data-theme", t);
            themeToggle.checked = t === "dark";
        }

        function applyLanguage(lang) {
            const dict = STRINGS[lang] || STRINGS.en;
            document.querySelectorAll("[data-i18n]").forEach(function (el) {
                const key = el.getAttribute("data-i18n");
                if (dict[key]) el.textContent = dict[key];
            });
            document.querySelectorAll("[data-i18n-placeholder]").forEach(function (el) {
                const key = el.getAttribute("data-i18n-placeholder");
                if (dict[key]) el.setAttribute("placeholder", dict[key]);
            });
            root.setAttribute("lang", lang);
            langField.value = lang;
            langButtons.forEach(function (btn) {
                btn.classList.toggle("active", btn.dataset.lang === lang);
            });
            updateFileHint();
        }

        applyTheme(localStorage.getItem("notes2pdf-theme") || "dark");
        applyLanguage(localStorage.getItem("notes2pdf-lang") || "en");

        themeToggle.addEventListener("change", function () {
            const next = themeToggle.checked ? "dark" : "light";
            localStorage.setItem("notes2pdf-theme", next);
            applyTheme(next);
        });

        langButtons.forEach(function (btn) {
            btn.addEventListener("click", function () {
                localStorage.setItem("notes2pdf-lang", btn.dataset.lang);
                applyLanguage(btn.dataset.lang);
            });
        });

        settingsToggle.addEventListener("click", function (e) {
            e.stopPropagation();
            const isOpen = !settingsPanel.classList.contains("hidden");
            settingsPanel.classList.toggle("hidden", isOpen);
            settingsToggle.setAttribute("aria-expanded", String(!isOpen));
        });

        document.addEventListener("click", function (e) {
            if (!settingsPanel.classList.contains("hidden") && !settingsPanel.contains(e.target) && e.target !== settingsToggle) {
                settingsPanel.classList.add("hidden");
                settingsToggle.setAttribute("aria-expanded", "false");
            }
        });
    })();

    const THEME_ACCENTS = {
        minimal: "#2563eb",
        dark: "#60a5fa",
        academic: "#7c2d12",
        github: "#0969da",
        sepia: "#7c3f1d",
        terminal: "#33ff66",
        notion: "#37352f"
    };

    (function () {
        const form = document.getElementById("pdf-form");
        const fileInput = document.getElementById("file");
        const platformSelect = document.getElementById("platform");
        const themeSelect = document.getElementById("theme");
        const accentColorInput = document.getElementById("accent_color");
        const watermarkType = document.getElementById("watermark_type");
        const watermarkTextGroup = document.getElementById("watermark-text-group");
        const watermarkImageGroup = document.getElementById("watermark-image-group");
        const watermarkSettingsGroup = document.getElementById("watermark-settings-group");
        const opacityInput = document.getElementById("watermark_opacity");
        const opacityValue = document.getElementById("opacity-value");
        const sizeInput = document.getElementById("watermark_size");
        const sizeValue = document.getElementById("watermark-size-value");
        const codeColorsEnabled = document.getElementById("code_colors_enabled");
        const codeColorsGroup = document.getElementById("code-colors-group");
        const codeColorsSame = document.getElementById("code_colors_same");
        const codeColorsShared = document.getElementById("code-colors-shared");
        const codeColorsSplit = document.getElementById("code-colors-split");
        const frame = document.getElementById("preview-frame");
        const placeholder = document.getElementById("preview-placeholder");
        const status = document.getElementById("preview-status");

        let currentObjectUrl = null;
        let debounceTimer = null;
        let requestSeq = 0;

        function currentLang() {
            return localStorage.getItem("notes2pdf-lang") || "en";
        }

        function syncWatermarkFields() {
            const type = watermarkType.value;
            watermarkTextGroup.classList.toggle("hidden", type !== "text");
            watermarkImageGroup.classList.toggle("hidden", type !== "image");
            watermarkSettingsGroup.classList.toggle("hidden", type === "none");
        }

        opacityInput.addEventListener("input", function () {
            opacityValue.textContent = opacityInput.value;
        });

        sizeInput.addEventListener("input", function () {
            sizeValue.textContent = sizeInput.value;
        });

        watermarkType.addEventListener("change", function () {
            syncWatermarkFields();
            schedulePreview();
        });

        themeSelect.addEventListener("change", function () {
            const suggested = THEME_ACCENTS[themeSelect.value];
            if (suggested) accentColorInput.value = suggested;
            schedulePreview();
        });

        platformSelect.addEventListener("change", function () {
            updateFileHint();
            schedulePreview();
        });

        codeColorsEnabled.addEventListener("change", function () {
            codeColorsGroup.classList.toggle("hidden", !codeColorsEnabled.checked);
            schedulePreview();
        });

        codeColorsSame.addEventListener("change", function () {
            codeColorsShared.classList.toggle("hidden", !codeColorsSame.checked);
            codeColorsSplit.classList.toggle("hidden", codeColorsSame.checked);
            schedulePreview();
        });

        function showPlaceholder(message, isError) {
            frame.classList.add("hidden");
            placeholder.classList.remove("hidden");
            placeholder.classList.toggle("error", !!isError);
            placeholder.textContent = message;
            placeholder.removeAttribute("data-i18n");
        }

        function setStatus(text, kind) {
            status.textContent = text;
            status.className = text ? "chip " + (kind === "fail" ? "chip-fail" : "chip-warn") : "";
        }

        function updatePreview() {
            if (!fileInput.files || !fileInput.files.length) {
                showPlaceholder(STRINGS[currentLang()].previewPlaceholder, false);
                placeholder.setAttribute("data-i18n", "previewPlaceholder");
                setStatus("");
                return;
            }

            const seq = ++requestSeq;
            setStatus(STRINGS[currentLang()].previewGenerating, "warn");

            fetch("/preview", { method: "POST", body: new FormData(form) })
                .then(function (res) {
                    if (seq !== requestSeq) return;
                    if (!res.ok) {
                        return res.text().then(function (msg) {
                            throw new Error(msg || STRINGS[currentLang()].previewError);
                        });
                    }
                    return res.blob();
                })
                .then(function (blob) {
                    if (!blob || seq !== requestSeq) return;
                    if (currentObjectUrl) URL.revokeObjectURL(currentObjectUrl);
                    currentObjectUrl = URL.createObjectURL(blob);
                    frame.src = currentObjectUrl;
                    frame.classList.remove("hidden");
                    placeholder.classList.add("hidden");
                    setStatus("");
                })
                .catch(function (err) {
                    if (seq !== requestSeq) return;
                    showPlaceholder(err.message, true);
                    setStatus("");
                });
        }

        function schedulePreview() {
            clearTimeout(debounceTimer);
            debounceTimer = setTimeout(updatePreview, 400);
        }

        form.addEventListener("input", schedulePreview);
        form.addEventListener("change", schedulePreview);

        syncWatermarkFields();
        updateFileHint();

        const initialAccent = THEME_ACCENTS[themeSelect.value];
        if (initialAccent) accentColorInput.value = initialAccent;
    })();
</script>
</body>
</html>
